<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sticky Board</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow" id="today-label">Today</p>
    <h1>Sticky Board</h1>
    <div class="progress-row">
      <span class="progress-text" id="progress-text">No notes yet</span>
      <div class="bar" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><span id="bar-fill"></span></div>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <div class="row">
      <input type="text" id="new-text" placeholder="Write a new sticky note..." aria-label="New task" maxlength="200">
      <input type="date" id="new-due" aria-label="Due date">
      <select id="new-pri" aria-label="Priority">
        <option value="low">Low priority</option>
        <option value="normal" selected>Normal priority</option>
        <option value="high">High priority</option>
      </select>
      <div class="swatches" role="radiogroup" aria-label="Note colour">
        <input type="radio" class="swatch" name="note-colour" id="sw0" value="0" style="--sw:var(--n0)" aria-label="Yellow" checked>
        <input type="radio" class="swatch" name="note-colour" id="sw1" value="1" style="--sw:var(--n1)" aria-label="Pink">
        <input type="radio" class="swatch" name="note-colour" id="sw2" value="2" style="--sw:var(--n2)" aria-label="Mint">
        <input type="radio" class="swatch" name="note-colour" id="sw3" value="3" style="--sw:var(--n3)" aria-label="Blue">
        <input type="radio" class="swatch" name="note-colour" id="sw4" value="4" style="--sw:var(--n4)" aria-label="Lilac">
        <input type="radio" class="swatch" name="note-colour" id="sw5" value="5" style="--sw:var(--n5)" aria-label="Peach">
      </div>
      <button type="submit" class="btn-add">Stick it up</button>
    </div>
    <p class="form-error" id="form-error" hidden>Write something on the note first.</p>
    <p class="hint">Press <kbd>/</kbd> to jump to the note box. While editing, Enter saves and Esc cancels.</p>
  </form>

  <div class="toolbar">
  <div class="tabs" role="group" aria-label="Filter notes" id="tabs">
    <button type="button" class="tab" data-filter="all" aria-pressed="true">All <span id="c-all">0</span></button>
    <button type="button" class="tab" data-filter="active" aria-pressed="false">To do <span id="c-active">0</span></button>
    <button type="button" class="tab" data-filter="done" aria-pressed="false">Done <span id="c-done">0</span></button>
  </div>
    <button type="button" class="btn-pdf" id="pdf-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
      Download PDF
    </button>
  </div>
  <p class="hint" id="pdf-status" role="status" hidden></p>

  <p class="note-hint" id="sample-note" hidden>
    <span>These are sample notes. Edit them as you like.</span>
    <button type="button" class="link-btn" id="remove-samples">Remove all samples</button>
  </p>

  <ul class="board" id="list" aria-live="polite"></ul>

  <div class="foot">
    <span class="hint">Your notes are saved in this browser.</span>
    <button type="button" class="link-btn" id="clear-done">Clear completed</button>
  </div>
</main>

  <script src="script.js"></script>
</body>
</html>
